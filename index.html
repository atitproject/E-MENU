<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>ليالي بسمة | Laialy Basma</title>
  <meta name="description" content="منيو مطعم ومقهى ليالي بسمة — مأكولات، مشاوي، مشروبات وأراجيل." />
  <meta name="theme-color" content="#1a3a32" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="wrap header-inner">
      <button class="icon-btn" id="menuBtn" aria-label="القائمة">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div class="brand">
        <p class="tag" id="tagline"></p>
        <h1 id="brandName"></h1>
      </div>

      <div class="lang">
        <button class="lang-btn" id="langBtn"><span id="langBtnLabel">العربية</span></button>
        <div class="lang-menu" id="langMenu"><!-- populated by app.js --></div>
      </div>
    </div>
  </header>

  <!-- Category rail -->
  <div class="cat-rail-outer">
    <div class="wrap">
      <div class="cat-rail scrollbar-hide" id="catRail"></div>
    </div>
  </div>

  <!-- Menu -->
  <main class="wrap" id="menuRoot"></main>

  <footer class="site-footer wrap">
    <p id="footerFollow">تابعونا على إنستغرام <a id="igFooter" href="#" target="_blank" rel="noopener"></a></p>
    <p style="margin-top:.5rem;opacity:.7">© <span id="year"></span> · <span id="rights"></span></p>
  </footer>

  <!-- Scroll to top -->
  <button class="to-top" id="toTop" aria-label="للأعلى">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7" />
    </svg>
  </button>

  <!-- Drawer (full category list) -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h2 id="drawerTitle">الأقسام</h2>
      <button class="icon-btn" id="drawerClose" aria-label="إغلاق">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="drawer-list" id="drawerList"></div>
  </aside>

  <!-- Instagram modal -->
  <div class="modal-overlay" id="igOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="ig-logo">
        <svg fill="currentColor" viewBox="0 0 24 24">

        </svg>
      </div>
      <p class="ig-label">Instagram</p>
      <h3 id="igTitle">تابعنا على إنستغرام</h3>
      <p class="handle" id="igHandle"></p>
      <div class="chips" id="igChips">
        <span class="chip"></span>
        <span class="chip"></span>
        <span class="chip"></span>
      </div>
      <a class="btn-follow" id="igFollow" href="#" target="_blank" rel="noopener">متابعة</a>
      <button class="btn-skip" id="igSkip">تخطي</button>
    </div>
  </div>

  <script src="menu-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
