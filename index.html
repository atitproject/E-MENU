<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>منيو مطعم | Restaurant Menu</title>
  <meta name="description" content="منيو مطعم إلكتروني — مأكولات، مشاوي، سلطات، مشروبات وأراجيل." />
  <meta name="theme-color" content="#1a3a32" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="wrap header-inner">
      <button class="icon-btn" id="menuBtn" aria-label="القائمة">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div class="brand">
        <p class="tag" id="tagline"></p>
        <h1 id="brandName"></h1>
      </div>

      <div class="lang">
        <button class="lang-btn" id="langBtn"><span id="langBtnLabel">العربية</span></button>
        <div class="lang-menu" id="langMenu"><!-- populated by app.js --></div>
      </div>
    </div>
  </header>

  <!-- Groups + Category rail -->
  <div class="cat-rail-outer">
    <div class="wrap">
      <div class="group-tabs scrollbar-hide" id="groupTabs"></div>
      <div class="cat-rail scrollbar-hide" id="catRail"></div>
    </div>
  </div>

  <!-- Menu -->
  <main class="wrap">
    <div class="search-wrap">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
      </svg>
      <input id="searchInput" class="search-input" type="search" autocomplete="off" />
    </div>
    <div id="menuRoot"></div>
    <p id="noResults" class="no-results" hidden></p>
  </main>

  <footer class="site-footer wrap">
    <div class="footer-social">
      <a id="fFb" class="foot-soc" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 9h3V6h-3c-1.9 0-3 1.3-3 3v2H9v3h2v6h3v-6h2.3l.7-3H14V9.5c0-.3.2-.5.5-.5z"/></svg>
      </a>
      <a id="fIg" class="foot-soc" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.2A3.8 3.8 0 1 0 12 15.8 3.8 3.8 0 0 0 12 8.2zm0 6.3A2.5 2.5 0 1 1 12 9.5a2.5 2.5 0 0 1 0 5zm4-6.6a.9.9 0 1 1-1.8 0 .9.9 0 0 1 1.8 0zM7 4.5h10A2.5 2.5 0 0 1 19.5 7v10A2.5 2.5 0 0 1 17 19.5H7A2.5 2.5 0 0 1 4.5 17V7A2.5 2.5 0 0 1 7 4.5zm0 1.3A1.2 1.2 0 0 0 5.8 7v10A1.2 1.2 0 0 0 7 18.2h10a1.2 1.2 0 0 0 1.2-1.2V7A1.2 1.2 0 0 0 17 5.8H7z"/></svg>
      </a>
      <a id="fTt" class="foot-soc" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 4c.3 1.9 1.6 3.3 3.5 3.6v2.3c-1.2 0-2.4-.4-3.5-1v5.4a5.1 5.1 0 1 1-5.1-5.1c.3 0 .5 0 .8.1v2.4a2.7 2.7 0 1 0 1.9 2.6V4H15z"/></svg>
      </a>
    </div>
    <a class="footer-phone" id="fPhone" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.8 2z"/></svg>
      <span id="fPhoneNum"></span>
    </a>
  </footer>

  <!-- Scroll to top -->
  <button class="to-top" id="toTop" aria-label="للأعلى">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7" />
    </svg>
  </button>

  <!-- Restaurant info popup -->
  <div class="info-overlay" id="infoModal">
    <div class="info-card" role="dialog" aria-modal="true">
      <div class="info-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M4 8h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z" stroke-linejoin="round"/>
          <path d="M17 9h2.2A2.3 2.3 0 0 1 21.5 11.3 2.3 2.3 0 0 1 19.2 13.6H17" stroke-linejoin="round"/>
          <path d="M8 2.5c-.5.8-.5 1.5 0 2.3M12 2.5c-.5.8-.5 1.5 0 2.3" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 id="infoName"></h2>
      <p class="info-sub" id="infoSub"></p>

      <a class="info-row" id="infoPhone" href="#">
        <span class="info-side"><span class="info-lbl" id="infoCallLbl"></span><span class="info-ico">📞</span></span>
        <span class="info-val" id="infoPhoneNum"></span>
      </a>
      <a class="info-row" id="infoLoc" target="_blank" rel="noopener">
        <span class="info-side"><span class="info-lbl" id="infoLocLbl"></span><span class="info-ico">📍</span></span>
        <span class="info-val"></span>
      </a>

      <div class="info-social">
        <a id="infoFb" class="social-btn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 9h3V6h-3c-1.9 0-3 1.3-3 3v2H9v3h2v6h3v-6h2.3l.7-3H14V9.5c0-.3.2-.5.5-.5z"/></svg>
          <span>Facebook</span>
        </a>
        <a id="infoIg" class="social-btn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.2A3.8 3.8 0 1 0 12 15.8 3.8 3.8 0 0 0 12 8.2zm0 6.3A2.5 2.5 0 1 1 12 9.5a2.5 2.5 0 0 1 0 5zm4-6.6a.9.9 0 1 1-1.8 0 .9.9 0 0 1 1.8 0zM7 4.5h10A2.5 2.5 0 0 1 19.5 7v10A2.5 2.5 0 0 1 17 19.5H7A2.5 2.5 0 0 1 4.5 17V7A2.5 2.5 0 0 1 7 4.5zm0 1.3A1.2 1.2 0 0 0 5.8 7v10A1.2 1.2 0 0 0 7 18.2h10a1.2 1.2 0 0 0 1.2-1.2V7A1.2 1.2 0 0 0 17 5.8H7z"/></svg>
          <span>Instagram</span>
        </a>
        <a id="infoTt" class="social-btn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 4c.3 1.9 1.6 3.3 3.5 3.6v2.3c-1.2 0-2.4-.4-3.5-1v5.4a5.1 5.1 0 1 1-5.1-5.1c.3 0 .5 0 .8.1v2.4a2.7 2.7 0 1 0 1.9 2.6V4H15z"/></svg>
          <span>TikTok</span>
        </a>
      </div>

      <button class="info-close-btn" id="infoClose"></button>
    </div>
  </div>

  <!-- Instagram modal -->
  <div class="modal-overlay" id="igOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="ig-logo">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2.2c3.2 0 3.6 0 4.9.07 1.17.05 1.8.25 2.23.42.56.22.96.48 1.38.9.42.42.68.82.9 1.38.17.42.37 1.06.42 2.23.06 1.3.07 1.69.07 4.9s0 3.6-.07 4.9c-.05 1.17-.25 1.8-.42 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.17-1.06.37-2.23.42-1.3.06-1.69.07-4.9.07s-3.6 0-4.9-.07c-1.17-.05-1.8-.25-2.23-.42a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.17-.42-.37-1.06-.42-2.23C2.21 15.6 2.2 15.21 2.2 12s0-3.6.07-4.9c.05-1.17.25-1.8.42-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.17 1.06-.37 2.23-.42C8.4 2.21 8.79 2.2 12 2.2zm0 1.98c-3.15 0-3.52.01-4.76.07-.9.04-1.38.19-1.71.32-.43.17-.74.37-1.06.69-.32.32-.52.63-.69 1.06-.13.33-.28.81-.32 1.71-.06 1.24-.07 1.61-.07 4.76s.01 3.52.07 4.76c.04.9.19 1.38.32 1.71.17.43.37.74.69 1.06.32.32.63.52 1.06.69.33.13.81.28 1.71.32 1.24.06 1.61.07 4.76.07s3.52-.01 4.76-.07c.9-.04 1.38-.19 1.71-.32.43-.17.74-.37 1.06-.69.32-.32.52-.63.69-1.06.13-.33.28-.81.32-1.71.06-1.24.07-1.61.07-4.76s-.01-3.52-.07-4.76c-.04-.9-.19-1.38-.32-1.71a2.85 2.85 0 0 0-.69-1.06 2.85 2.85 0 0 0-1.06-.69c-.33-.13-.81-.28-1.71-.32-1.24-.06-1.61-.07-4.76-.07zm0 3.37a4.45 4.45 0 1 1 0 8.9 4.45 4.45 0 0 1 0-8.9zm0 7.34a2.89 2.89 0 1 0 0-5.78 2.89 2.89 0 0 0 0 5.78zm5.66-7.53a1.04 1.04 0 1 1-2.08 0 1.04 1.04 0 0 1 2.08 0z"/>
        </svg>
      </div>
      <p class="ig-label">Instagram</p>
      <h3 id="igTitle">تابعنا على إنستغرام</h3>
      <p class="handle" id="igHandle"></p>
      <div class="chips" id="igChips">
        <span class="chip"></span>
        <span class="chip"></span>
        <span class="chip"></span>
      </div>
      <a class="btn-follow" id="igFollow" href="#" target="_blank" rel="noopener">متابعة</a>
      <button class="btn-skip" id="igSkip">تخطي</button>
    </div>
  </div>

  <!-- Item detail bottom-sheet -->
  <div class="sheet-overlay" id="itemModal">
    <div class="sheet" role="dialog" aria-modal="true">
      <span class="sheet-handle"></span>
      <button class="sheet-close" id="itemClose" aria-label="إغلاق">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <div class="sheet-img">
        <img id="itemImg" alt="" />
      </div>
      <div class="sheet-body">
        <h2 id="itemName"></h2>
        <p class="sheet-desc" id="itemDesc"></p>
        <div class="sheet-price-row">
          <div class="sheet-price">
            <span class="lbl" id="priceLbl"></span>
            <span class="val"><span id="itemPrice"></span><span class="cur">₪</span></span>
          </div>
          <span class="avail" id="itemAvail"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Rate us floating button -->
  <button class="rate-fab" id="rateFab" aria-label="قيّمنا">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9L12 3.5z"/></svg>
    <span id="rateFabLbl"></span>
  </button>

  <!-- Rating modal -->
  <div class="rate-overlay" id="rateModal">
    <div class="rate-card" role="dialog" aria-modal="true">
      <div class="rate-logo">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9L12 3.5z"/></svg>
      </div>
      <h3 id="rateTitle"></h3>
      <p class="rate-sub" id="rateSub"></p>
      <div class="rate-stars" id="rateStars">
        <button type="button" data-v="1">★</button>
        <button type="button" data-v="2">★</button>
        <button type="button" data-v="3">★</button>
        <button type="button" data-v="4">★</button>
        <button type="button" data-v="5">★</button>
      </div>
      <textarea id="rateComment" class="rate-comment" rows="3"></textarea>
      <button class="rate-submit" id="rateSubmit" disabled></button>
      <button class="rate-close" id="rateClose"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="menu-data.js"></script>
  <script src="app.js"></script>
  <script src="data-loader.js"></script>
</body>
</html>
